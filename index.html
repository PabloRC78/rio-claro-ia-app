<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agente Río Claro</title>
</head>
<body>

<h1>Agente Río Claro</h1>

<textarea id="pregunta"></textarea>

<br><br>

<button onclick="preguntar()">Enviar</button>

<div id="respuesta"></div>

<script>
async function preguntar() {
    try {
        const pregunta = document.getElementById("pregunta").value;

        const resultado = await fetch(
            "https://rio-claro-api-e7h6chg9f8czbyf6.westus3-01.azurewebsites.net/api/chatapi",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    pregunta: pregunta
                })
            }
        );

        const datos = await resultado.json();

        document.getElementById("respuesta").innerText =
            JSON.stringify(datos);

    } catch (error) {
        document.getElementById("respuesta").innerText =
            error.toString();
    }
}
</script>

</body>
</html>
