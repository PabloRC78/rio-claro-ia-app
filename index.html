<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agente Río Claro</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

h1{
    color: #1f4e79;
}

textarea{
    width: 100%;
    height: 120px;
    padding: 10px;
    resize: vertical;
}

button{
    margin-top: 10px;
    padding: 10px 20px;
}

#respuesta{
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #ccc;
    background-color: #f5f5f5;
    white-space: pre-wrap;
}
</style>

</head>

<body>

<h1>Agente Río Claro</h1>

<textarea
id="pregunta"
placeholder="Escribe una consulta sobre facturas, clientes, catálogo, políticas o quejas"></textarea>

<br><br>

<button onclick="preguntar()">
Enviar
</button>

<div id="respuesta"></div>

<script>

async function preguntar() {

    try {

        const pregunta =
            document.getElementById("pregunta").value;

        const resultado = await fetch(
            "https://rio-claro-api-e7h6chg9f8czbyf6.westus3-01.azurewebsites.net/api/chatapi",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    pregunta: pregunta
                })
            }
        );

        const datos = await resultado.json();

        document.getElementById("respuesta").innerText =
            datos.respuesta;

    } catch (error) {

        document.getElementById("respuesta").innerText =
            "Error: " + error;

    }

}

</script>

</body>
</html>
