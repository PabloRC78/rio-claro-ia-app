<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Agente Río Claro</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 0;
}

.contenedor{
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

h1{
    text-align: center;
    color: #0f4c81;
    margin-bottom: 10px;
}

.subtitulo{
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

textarea{
    width: 100%;
    height: 120px;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #cfd8dc;
    border-radius: 8px;
    box-sizing: border-box;
}

button{
    background: #0f4c81;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    margin-top: 12px;
    cursor: pointer;
    font-size: 16px;
}

button:hover{
    background: #1565c0;
}

#respuesta{
    margin-top: 20px;
    padding: 20px;
    border-radius: 8px;
    background: #eef6ff;
    border-left: 5px solid #1565c0;
    white-space: pre-wrap;
    min-height: 80px;
}

.footer{
    margin-top: 25px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="contenedor">

    <h1>🏢 Agente Inteligente Río Claro</h1>

    <div class="subtitulo">
        Consulta facturas, clientes, catálogo, políticas y quejas
    </div>

    <textarea
        id="pregunta"
        placeholder="Ejemplo: Dame la factura RC001">
    </textarea>

    <br>

    <button onclick="preguntar()">
        Consultar
    </button>

    <div id="respuesta">
        Escribe una pregunta para comenzar.
    </div>

    <div class="footer">
        Proyecto AI-901 | Distribuidora Río Claro
    </div>

</div>

<script>

async function preguntar() {

    try {

        document.getElementById("respuesta").innerText =
            "Consultando información...";

        const pregunta =
            document.getElementById("pregunta").value;

        const resultado = await fetch(
            "https://rio-claro-api-e7h6chg9f8czbyf6.westus3-01.azurewebsites.net/api/chatapi",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    pregunta: pregunta
                })
            }
        );

        const datos = await resultado.json();

        document.getElementById("respuesta").innerText =
            datos.respuesta;

    }

    catch(error){

        document.getElementById("respuesta").innerText =
            "Error al consultar la información.";

    }

}

</script>

</body>
</html>
